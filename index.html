<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D5C9B4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vandaag in het nieuws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700;6..72,800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Thema: groen, zand, oranje. Kleur heeft betekenis:
   koerslabels: donkergroen = sterk gestegen, mosgroen = licht gestegen, zand = vlak,
   perzik = licht gedaald, oranje = sterk gedaald. Oranje tekst = rubriek. */
:root {
  --bg: #F6F3EE; --sand: #D5C9B4; --sand-2: #E8E0D2; --ink: #1E2214; --ink-2: #3A3F2C; --muted: #5F644C;
  --olive: #4F5932; --moss: #8C9640; --orange: #D9893A; --rubriek: #9A5514;
  --up: #2F5E22; --down: #A33A1A;
  --serif: Newsreader, Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--sand); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Kop */
.top { max-width: 640px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 20px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--ink); background: var(--bg); flex: 0 0 auto; }
.brand h1 { margin: 0; font-family: var(--serif); font-weight: 800; font-size: 27px; line-height: 1; letter-spacing: -0.02em; }
.stempel { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ink); background: var(--orange); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-8deg); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; cursor: pointer; padding: 0; }
.stempel .l1 { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.stempel .l2 { font-family: var(--serif); font-size: 22px; font-weight: 800; }
.stempel .l3 { font-size: 10px; font-weight: 700; }
.stempel[disabled] { opacity: 0.6; }

/* Pagina */
.sheet { background: var(--bg); border-top: 2px solid var(--ink); border-radius: 22px 22px 0 0; min-height: calc(100vh - 116px); }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 18px 120px; display: flex; flex-direction: column; gap: 22px; }
.melding { font-size: 13px; font-weight: 600; background: var(--sand-2); border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 12px; }
.melding:empty { display: none; }
#status { font-size: 12px; color: var(--muted); margin-top: -12px; }
#status:empty { display: none; }
.rubriek { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rubriek); }
h2.sec { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 800; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
h2.sec small { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 12px; }

/* Koerslabels */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

/* Samenvatting */
.lead-card { background: #FFFFFF; border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px; font-family: var(--serif); font-size: 17px; line-height: 1.5; color: var(--ink-2); }

/* Beeld */
.beeld { position: relative; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--moss); }
.beeld img { display: block; width: 100%; height: 100%; object-fit: cover; }
.beeld .credit { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); font-size: 10px; line-height: 1.3; background: rgba(246,243,238,0.92); color: var(--ink); border-radius: 4px; padding: 2px 6px; }
.beeld .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 800; font-size: 20px; color: rgba(246,243,238,0.9); text-align: center; padding: 10px; }

/* Openingsbericht */
.opening { display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.opening .beeld { height: 200px; }
.opening h3 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 800; line-height: 1.12; }
.opening p { font-family: var(--serif); font-size: 16px; color: var(--ink-2); }

/* Kaartenraster */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kaart { border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer; }
.kaart .beeld { height: 84px; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; }
.kaart .tx { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 3px; }
.kaart .kop { font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1.22; }

/* Tabs/filters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font-size: 13px; font-weight: 700; border: 1.5px solid var(--ink); background: var(--bg); border-radius: 999px; padding: 7px 13px; min-height: 38px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Artikelen */
.items { display: flex; flex-direction: column; gap: 12px; }
details.art { border: 2px solid var(--ink); border-radius: 14px; background: #FFFFFF; overflow: hidden; }
details.art summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 12px; padding: 12px; }
details.art summary::-webkit-details-marker { display: none; }
details.art .sum-tx { display: flex; flex-direction: column; gap: 4px; }
details.art .kop { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.2; }
details.art .kort { font-size: 14px; color: var(--ink-2); }
details.art .thumb { width: 84px; height: 84px; border-radius: 10px; }
details.art .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; border: 1.5px solid var(--ink); }
.tag.raakt { background: var(--moss); color: var(--ink); }
details.art .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
details.art .body .beeld { height: 190px; }
details.art .detail { font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink); }
.les { font-size: 14px; background: var(--sand-2); border-radius: 10px; padding: 10px 12px; }
.les b { color: var(--rubriek); }
.begr { border-top: 2px solid var(--ink); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.begr .bt { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.begr .term { font-size: 15px; font-weight: 700; }
.begr .uitleg, .begr .gevolg { font-size: 14px; color: var(--ink-2); }
.begr .gevolg b { color: var(--rubriek); }
.bronnen { display: flex; flex-wrap: wrap; gap: 8px; }
.bronnen a { font-size: 13px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--ink); border-radius: 999px; padding: 7px 13px; min-height: 36px; display: inline-flex; align-items: center; background: var(--bg); }

/* Tabellen */
.tabel { background: #FFFFFF; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; }
.rij { display: grid; grid-template-columns: minmax(0, 1fr) auto 84px; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1.5px solid var(--sand); }
.rij:last-child { border-bottom: 0; }
.rij .nm { font-weight: 600; font-size: 14px; }
.rij .nm small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
.rij .v { font-size: 14px; text-align: right; }
.rij .chip { text-align: center; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 60px 70px; gap: 10px; padding: 10px 14px; border-bottom: 1.5px solid var(--sand); font-size: 14px; }
.prow:last-child { border-bottom: 0; }
.prow span:not(:first-child) { text-align: right; font-weight: 700; }
.up { color: var(--up); } .down { color: var(--down); }

/* Portefeuille */
.result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.result .vak { border: 2px solid var(--ink); border-radius: 14px; background: #FFFFFF; padding: 12px 14px; display: flex; flex-direction: column; }
.result .lab { font-size: 12px; font-weight: 700; color: var(--muted); }
.result .groot { font-family: var(--serif); font-size: 32px; font-weight: 800; line-height: 1.1; }
.verd { background: #FFFFFF; border: 2px solid var(--ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.vrij { display: grid; grid-template-columns: 76px minmax(0, 1fr) 82px; gap: 10px; align-items: center; font-size: 14px; }
.vrij .lbl { font-weight: 700; }
.bar { position: relative; height: 12px; background: var(--sand-2); border: 1.5px solid var(--ink); border-radius: 999px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
.bar .doel { position: absolute; top: -5px; width: 3px; height: 20px; background: var(--ink); border-radius: 2px; }
.vrij .fig { text-align: right; font-size: 13px; color: var(--muted); }
.inleg { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; border: 1.5px solid var(--ink); background: var(--orange); border-radius: 999px; padding: 1px 6px; margin-top: 3px; }

/* Agenda */
.ag { display: grid; grid-template-columns: 66px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1.5px solid var(--sand); }
.ag:last-child { border-bottom: 0; }
.ag .d { font-size: 12px; font-weight: 800; text-align: center; background: var(--sand-2); border-radius: 10px; padding: 5px 0; }
.ag .ev { font-size: 14px; font-weight: 700; }
.ag .sub { font-size: 12px; color: var(--muted); }
.impact { font-size: 11px; font-weight: 800; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.impact.hoog { background: var(--orange); }
.impact.middel { background: #F2C9A4; }
.impact.laag { background: var(--sand-2); }

/* Kaders */
.blok { background: #FFFFFF; border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.blok dl { margin: 0; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.blok dt { color: var(--muted); }
.blok dd { margin: 0; }
.risico { background: #FFFFFF; border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; }
.risico::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--orange); border: 1.5px solid var(--ink); margin-top: 6px; }
footer { font-size: 12px; color: var(--muted); text-align: center; }

/* Menubalk */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--olive); padding: 10px 8px max(14px, env(safe-area-inset-bottom)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
nav.tabs button { border: 0; background: transparent; color: var(--bg); font-size: 13px; font-weight: 600; border-radius: 999px; padding: 11px 0; min-height: 44px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: var(--sand); color: var(--ink); font-weight: 800; }

/* Slot */
#lock { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; background: var(--sand); }
#lock[hidden] { display: none; }
#lock form { width: 100%; max-width: 360px; background: var(--bg); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 5px 5px 0 var(--ink); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
#lock img { width: 72px; height: 72px; border-radius: 16px; border: 2px solid var(--ink); }
#lock h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 800; }
#lock label { font-size: 13px; color: var(--muted); }
#lock input { font: inherit; font-size: 16px; border: 2px solid var(--ink); border-radius: 10px; padding: 12px; background: #FFFFFF; color: var(--ink); }
#lock button { font-size: 16px; font-weight: 800; border: 2px solid var(--ink); background: var(--orange); border-radius: 10px; padding: 12px; cursor: pointer; }
#lockmsg { font-size: 13px; color: var(--down); min-height: 1em; }
.empty { font-size: 14px; color: var(--muted); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div id="lock" hidden>
  <form id="lockform" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h2>Vandaag in het nieuws</h2>
    <label for="code">Voer je code in. De app onthoudt hem op dit toestel.</label>
    <input id="code" type="password" autocomplete="current-password" required>
    <button type="submit">Openen</button>
    <p id="lockmsg" role="alert"></p>
  </form>
</div>

<header class="top">
  <div class="brand">
    <img src="icon-192.png" alt="" width="48" height="48">
    <h1>Vandaag in<br>het nieuws</h1>
  </div>
  <button type="button" class="stempel" id="ververs" aria-label="Nieuwste editie ophalen">
    <span class="l1">Editie</span><span class="l2" id="st-tijd">--:--</span><span class="l3" id="st-dag"></span>
  </button>
</header>

<main class="sheet">
  <div class="wrap">
    <p class="melding" id="opmerking"></p>
    <p id="status" aria-live="polite"></p>

    <!-- Vandaag -->
    <section id="v-vandaag" class="section" aria-label="Vandaag">
      <div class="chips" id="chips-top"></div>
      <div class="lead-card" id="samenvatting"></div>
      <div id="opening"></div>
      <div class="grid2" id="raster"></div>
      <div class="section">
        <h2 class="sec">Agenda <small>komende dagen</small></h2>
        <div class="tabel" id="agenda-kort"></div>
      </div>
      <div class="section">
        <h2 class="sec">Risico's</h2>
        <div class="items" id="risicos"></div>
      </div>
    </section>

    <!-- Nieuws -->
    <section id="v-nieuws" class="section" aria-label="Nieuws" hidden>
      <h2 class="sec">Beursnieuws <small>bedrijven en markten</small></h2>
      <div class="filters" role="group" aria-label="Filter beursnieuws">
        <button type="button" data-f="alles" aria-pressed="true">Alles</button>
        <button type="button" data-f="Nederland" aria-pressed="false">Nederland</button>
        <button type="button" data-f="Internationaal" aria-pressed="false">Internationaal</button>
        <button type="button" data-f="raakt" aria-pressed="false">Mijn fondsen</button>
      </div>
      <div class="items" id="nieuws"></div>
      <h2 class="sec" style="margin-top: 10px;">Economie en beleid <small>politiek en centrale banken</small></h2>
      <div class="items" id="economie"></div>
    </section>

    <!-- Markten -->
    <section id="v-markten" class="section" aria-label="Markten" hidden>
      <h2 class="sec">Markten <small id="m-tijd"></small></h2>
      <div class="tabel" id="markten"></div>
      <p class="note" id="mtoel"></p>
      <h2 class="sec" style="margin-top: 10px;">Agenda</h2>
      <div class="tabel" id="agenda"></div>
      <p class="note" id="inspelen"></p>
    </section>

    <!-- Portefeuille -->
    <section id="v-port" class="section" aria-label="Portefeuille" hidden>
      <h2 class="sec">Mijn portefeuille</h2>
      <div class="result" id="result"></div>
      <div class="tabel" id="posities"></div>
      <div class="verd" id="verdeling"></div>
      <p class="note" id="ptoel"></p>
      <h2 class="sec" style="margin-top: 10px;">Plan A</h2>
      <div class="blok"><p id="plana"></p></div>
      <h2 class="sec" style="margin-top: 10px;">Kortetermijnidee <small>buiten Plan A</small></h2>
      <div class="blok" id="kortetermijn"></div>
    </section>

    <footer>Hypothetische analyse, geen persoonlijk beleggingsadvies.</footer>
  </div>
</main>

<nav class="tabs" aria-label="Hoofdmenu">
  <div class="in">
    <button type="button" data-v="vandaag" aria-current="page">Vandaag</button>
    <button type="button" data-v="nieuws">Nieuws</button>
    <button type="button" data-v="markten">Markten</button>
    <button type="button" data-v="port">Portefeuille</button>
  </div>
</nav>

<script>
(function () {
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = String(text); return n; }
  function $(id) { return document.getElementById(id); }
  function safeUrl(u) { return typeof u === 'string' && /^https:\/\//i.test(u) ? u : null; }
  function dirClass(r) { return r > 0 ? 'up' : (r < 0 ? 'down' : ''); }
  function fmt(x) { return String(x).replace('.', ','); }

  // Koerslabel: kleur volgt richting en grootte van de beweging.
  function chipStyle(p) {
    if (p >= 1) return { bg: '#4F5932', fg: '#F6F3EE' };
    if (p > 0) return { bg: '#C9D08E', fg: '#1E2214' };
    if (p <= -1) return { bg: '#D9893A', fg: '#1E2214' };
    if (p < 0) return { bg: '#F2C9A4', fg: '#1E2214' };
    return { bg: '#D5C9B4', fg: '#1E2214' };
  }
  function chip(text, pct) { var c = el('span', 'chip num', text); var s = chipStyle(Number(pct) || 0); c.style.background = s.bg; c.style.color = s.fg; return c; }

  var PH = { Nederland: '#D9893A', Internationaal: '#4F5932', economie: '#8C9640' };
  function beeld(n, cls, alt) {
    var b = el('div', 'beeld' + (cls ? ' ' + cls : ''));
    var u = n && n.beeld && safeUrl(n.beeld.url);
    if (u) {
      var img = document.createElement('img'); img.src = u; img.alt = alt || ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.onerror = function () { img.remove(); b.style.background = PH[n.categorie] || '#8C9640'; };
      b.appendChild(img);
      if (n.beeld.bron) b.appendChild(el('span', 'credit', n.beeld.bron));
    } else {
      b.style.background = (n && n._eco) ? PH.economie : (PH[n && n.categorie] || '#8C9640');
      if (!cls) b.appendChild(el('div', 'ph', n && n.categorie ? n.categorie : ''));
    }
    return b;
  }
  function bronnen(list) {
    var box = el('div', 'bronnen');
    (list || []).forEach(function (b) { var u = safeUrl(b && b.url); if (!u) return; var a = el('a', null, (b.naam || 'Bron') + ' ↗'); a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; box.appendChild(a); });
    return box;
  }

  var data = null, filter = 'alles', view = 'vandaag';

  function artikel(n) {
    var d = el('details', 'art');
    var s = document.createElement('summary');
    var tx = el('div', 'sum-tx');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'rubriek', n._eco ? 'Economie · ' + n.categorie : n.categorie));
    if (n.raaktPortefeuille) meta.appendChild(el('span', 'tag raakt', 'Mijn fondsen'));
    tx.appendChild(meta); tx.appendChild(el('span', 'kop', n.kop)); tx.appendChild(el('span', 'kort', n.kort));
    s.appendChild(tx); s.appendChild(beeld(n, 'thumb', ''));
    d.appendChild(s);
    var body = el('div', 'body');
    if (n.beeld && safeUrl(n.beeld.url)) body.appendChild(beeld(n, null, n.kop));
    body.appendChild(el('p', 'detail', n.detail || n.kort));
    if (n.begrippen && n.begrippen.length) {
      var bg = el('div', 'begr'); bg.appendChild(el('span', 'bt', 'Begrippen uitgelegd'));
      n.begrippen.forEach(function (b) {
        if (!b || !b.term) return; var w = el('div');
        w.appendChild(el('div', 'term', b.term));
        if (b.uitleg) w.appendChild(el('p', 'uitleg', b.uitleg));
        if (b.gevolg) { var g = el('p', 'gevolg'); g.appendChild(el('b', null, 'Gevolg: ')); g.appendChild(document.createTextNode(b.gevolg)); w.appendChild(g); }
        bg.appendChild(w);
      });
      body.appendChild(bg);
    }
    if (n.lesbegrip) { var l = el('p', 'les'); l.appendChild(el('b', null, 'Voor in de les: ')); l.appendChild(document.createTextNode(n.lesbegrip)); body.appendChild(l); }
    body.appendChild(bronnen(n.bronnen));
    d.appendChild(body);
    return d;
  }
  function openArtikel(n) {
    show('nieuws');
    setTimeout(function () {
      var all = document.querySelectorAll('details.art');
      for (var i = 0; i < all.length; i++) { if (all[i]._item === n) { all[i].open = true; all[i].scrollIntoView({ block: 'start', behavior: 'smooth' }); break; } }
    }, 30);
  }

  function renderNieuws() {
    var host = $('nieuws'); host.textContent = '';
    var items = (data.nieuws || []).filter(function (n) { return filter === 'alles' ? true : filter === 'raakt' ? !!n.raaktPortefeuille : n.categorie === filter; });
    if (!items.length) host.appendChild(el('p', 'empty', 'Geen berichten in deze categorie.'));
    items.forEach(function (n) { var a = artikel(n); a._item = n; host.appendChild(a); });
  }

  function agendaRows(host, list) {
    host.textContent = '';
    if (!list.length) { host.appendChild(el('p', 'empty', 'Geen agendapunten.')); host.style.padding = '12px 14px'; return; }
    list.forEach(function (a) {
      var r = el('div', 'ag');
      r.appendChild(el('span', 'd', a.datum));
      var m = el('div'); m.appendChild(el('div', 'ev', a.gebeurtenis)); m.appendChild(el('div', 'sub', (a.tijd ? a.tijd + ' · ' : '') + (a.toelichting || ''))); r.appendChild(m);
      var lvl = (a.belang || 'laag').toLowerCase(); r.appendChild(el('span', 'impact ' + lvl, lvl));
      host.appendChild(r);
    });
  }

  function render() {
    var dp = (data.datum || '').split(' ');
    $('st-tijd').textContent = data.tijd || '--:--';
    $('st-dag').textContent = dp.length >= 3 ? dp[0].slice(0, 2) + ' ' + dp[1] + ' ' + dp[2].slice(0, 3) : '';
    $('opmerking').textContent = data.opmerking || '';

    var markten = data.markten || [];
    var top = $('chips-top'); top.textContent = '';
    markten.slice(0, 6).forEach(function (m) { top.appendChild(chip(m.naam + ' ' + m.verandering, m.pct)); });
    $('samenvatting').textContent = data.samenvatting || '';

    var nieuws = (data.nieuws || []).slice(), eco = (data.economie || []).map(function (e) { var c = Object.assign({}, e); c._eco = true; return c; });
    var alle = nieuws.concat(eco);
    var lead = nieuws[0] || eco[0];
    var op = $('opening'); op.textContent = '';
    if (lead) {
      var b = el('button', 'opening'); b.type = 'button';
      b.appendChild(beeld(lead, null, lead.kop));
      b.appendChild(el('span', 'rubriek', lead._eco ? 'Economie en beleid' : 'Beurs · ' + lead.categorie));
      b.appendChild(el('h3', null, lead.kop));
      b.appendChild(el('p', null, lead.kort));
      b.addEventListener('click', function () { openArtikel(lead); });
      op.appendChild(b);
    }
    var ras = $('raster'); ras.textContent = '';
    alle.filter(function (n) { return n !== lead; }).slice(0, 4).forEach(function (n) {
      var k = el('button', 'kaart'); k.type = 'button';
      k.appendChild(beeld(n, 'klein', ''));
      var tx = el('div', 'tx'); tx.appendChild(el('span', 'rubriek', n._eco ? 'Economie' : 'Beurs')); tx.appendChild(el('span', 'kop', n.kop)); k.appendChild(tx);
      k.addEventListener('click', function () { openArtikel(n); });
      ras.appendChild(k);
    });
    agendaRows($('agenda-kort'), (data.agenda || []).slice(0, 3));
    var rl = $('risicos'); rl.textContent = '';
    (data.risicos || []).forEach(function (r) { rl.appendChild(el('div', 'risico', r)); });

    renderNieuws();
    var eh = $('economie'); eh.textContent = '';
    if (!eco.length) eh.appendChild(el('p', 'empty', 'In deze editie geen apart economisch nieuws.'));
    eco.forEach(function (n) { var a = artikel(n); a._item = n; eh.appendChild(a); });

    var mt = $('markten'); mt.textContent = '';
    markten.forEach(function (m) {
      var r = el('div', 'rij'); var nm = el('span', 'nm', m.naam); nm.appendChild(el('small', null, m.tijd || '')); r.appendChild(nm);
      r.appendChild(el('span', 'v num', m.stand)); r.appendChild(chip(m.verandering, m.pct)); mt.appendChild(r);
    });
    $('mtoel').textContent = data.marktenToelichting || '';
    agendaRows($('agenda'), data.agenda || []);
    $('inspelen').textContent = data.agendaInspelen || '';

    var p = data.portefeuille || {};
    var res = $('result'); res.textContent = '';
    var v1 = el('div', 'vak'); v1.appendChild(el('span', 'lab', 'Dagresultaat' + (p.schatting ? ' (schatting)' : ''))); v1.appendChild(el('span', 'groot num ' + dirClass(p.totaalRichting), p.totaalEur || '–')); res.appendChild(v1);
    var v2 = el('div', 'vak'); v2.appendChild(el('span', 'lab', 'Procent')); v2.appendChild(el('span', 'groot num ' + dirClass(p.totaalRichting), p.totaalPct || '–')); res.appendChild(v2);
    var pos = $('posities'); pos.textContent = ''; pos.hidden = !(p.posities || []).length;
    (p.posities || []).forEach(function (r) { var row = el('div', 'prow'); row.appendChild(el('span', null, r.naam)); row.appendChild(el('span', 'num ' + dirClass(r.richting), r.pct)); row.appendChild(el('span', 'num ' + dirClass(r.richting), r.eur)); pos.appendChild(row); });
    var vd = $('verdeling'); vd.textContent = '';
    var verd = p.verdeling || []; vd.hidden = !verd.length;
    vd.appendChild(el('span', 'rubriek', 'Verdeling Plan A: nu tegenover doel'));
    var lowest = null, gap = 0;
    verd.forEach(function (a) { var g = (Number(a.doel) || 0) - (Number(a.nu) || 0); if (g > gap) { gap = g; lowest = a.naam; } });
    verd.forEach(function (a) {
      var nu = Number(a.nu) || 0, doel = Number(a.doel) || 0, diff = nu - doel;
      var r = el('div', 'vrij'); var lbl = el('span', 'lbl', a.naam);
      if (a.naam === lowest && gap > 0) { lbl.appendChild(document.createElement('br')); lbl.appendChild(el('span', 'inleg', 'VOLGENDE INLEG')); }
      r.appendChild(lbl);
      var bar = el('span', 'bar'); bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', a.naam + ': nu ' + fmt(nu) + '%, doel ' + fmt(doel) + '%');
      var f = el('span', 'fill'); f.style.width = Math.min(100, nu) + '%'; f.style.background = Math.abs(diff) <= 1 ? '#8C9640' : (diff < 0 ? '#D9893A' : '#4F5932');
      var t = el('span', 'doel'); t.style.left = 'calc(' + Math.min(100, doel) + '% - 1px)';
      bar.appendChild(f); bar.appendChild(t); r.appendChild(bar);
      r.appendChild(el('span', 'fig num', fmt(nu) + ' / ' + fmt(doel)));
      vd.appendChild(r);
    });
    $('ptoel').textContent = p.toelichting || '';
    $('plana').textContent = data.planA || '';
    var kt = data.kortetermijn || {}, kh = $('kortetermijn'); kh.textContent = '';
    if (kt.idee) {
      var i = kt.idee, dl = document.createElement('dl');
      [['Instrument', i.instrument], ['Richting', i.richting], ['Aanleiding', i.aanleiding], ['Instap', i.instap], ['Stop-loss', i.stopLoss], ['Koersdoel', i.koersdoel], ['Risico/rendement', i.risicoRendement], ['Horizon', i.horizon], ['Max. verlies op €500', i.maxVerlies], ["Risico's", i.risicos]].forEach(function (x) { if (!x[1]) return; dl.appendChild(el('dt', null, x[0])); dl.appendChild(el('dd', null, x[1])); });
      kh.appendChild(dl); if (i.bronnen) kh.appendChild(bronnen(i.bronnen));
    } else kh.appendChild(el('p', null, kt.tekst || 'Geen idee met voldoende onderbouwing op dit moment.'));
    kh.appendChild(el('p', 'note', 'Hypothetisch idee, geen advies. De meeste kortetermijntransacties leiden tot verlies.'));
  }

  // Navigatie
  var views = { vandaag: 'v-vandaag', nieuws: 'v-nieuws', markten: 'v-markten', port: 'v-port' };
  function show(v) {
    view = v;
    Object.keys(views).forEach(function (k) { $(views[k]).hidden = k !== v; });
    document.querySelectorAll('nav.tabs button').forEach(function (b) { if (b.getAttribute('data-v') === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
  }
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-v')); }); });
  document.querySelectorAll('.filters button').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.getAttribute('data-f');
      document.querySelectorAll('.filters button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      if (data) renderNieuws();
    });
  });
  var start = (location.hash || '').slice(1); if (views[start]) show(start);

  // Versleutelde gegevens: AES-GCM met een sleutel afgeleid van de code (PBKDF2-SHA256).
  var KEYNAME = 'bdb-code', memCode = null;
  function getCode() { try { return localStorage.getItem(KEYNAME); } catch (e) { return null; } }
  function setCode(c) { try { localStorage.setItem(KEYNAME, c); } catch (e) {} }
  function clearCode() { try { localStorage.removeItem(KEYNAME); } catch (e) {} }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function decrypt(env, code) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(env.salt), iterations: env.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, key, b64(env.ct)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  var lastStamp = null, lastEnv = null, lock = $('lock'), lockmsg = $('lockmsg');
  function showLock(msg) { lock.hidden = false; lockmsg.textContent = msg || ''; setTimeout(function () { $('code').focus(); }, 50); }
  function stampOf(j) { return (j && (j.datum || '') + '|' + (j.tijd || '')) || ''; }
  function apply(j) { var s = stampOf(j); if (s !== lastStamp) { lastStamp = s; data = j; render(); return true; } return false; }
  function load() {
    return fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (env) {
        lastEnv = env;
        var code = memCode || getCode();
        if (!code) { showLock(); return false; }
        return decrypt(env, code).then(function (j) { memCode = code; lock.hidden = true; return apply(j); },
          function () { clearCode(); memCode = null; showLock('Deze code klopt niet.'); return false; });
      })
      .catch(function () { if (!data) $('opmerking').textContent = 'Het dagbericht kon niet worden geladen. Controleer je internetverbinding.'; return false; });
  }
  $('lockform').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('code').value;
    if (!lastEnv) { memCode = code; setCode(code); load(); return; }
    decrypt(lastEnv, code).then(function (j) { memCode = code; setCode(code); lock.hidden = true; $('code').value = ''; apply(j); },
      function () { lockmsg.textContent = 'Deze code klopt niet.'; });
  });
  load();
  setInterval(function () { if (!document.hidden) load(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });

  var btn = $('ververs'), status = $('status');
  function hhmm() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  btn.addEventListener('click', function () {
    btn.disabled = true; status.textContent = 'Bezig met ophalen…';
    load().then(function (changed) { btn.disabled = false; status.textContent = changed ? 'Nieuwe editie geladen om ' + hhmm() + '.' : 'Je hebt de nieuwste editie (gecontroleerd om ' + hhmm() + ').'; });
  });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
